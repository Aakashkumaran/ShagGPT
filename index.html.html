<title>ShagGPT</title>
<style>
:root{--bg:#14090f;--card:#221019;--card2:#2d1722;--ink:#f6e9ee;--mut:#a98c99;--acc:#ff4d79;--acc2:#ffb347;--ok:#4ade80}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.4 -apple-system,Segoe UI,Roboto,sans-serif;padding-bottom:84px}
header{padding:16px 16px 6px;display:flex;justify-content:space-between;align-items:center}
h1{margin:0;font-size:22px;letter-spacing:.5px}
.lvl{font-size:12px;color:var(--mut);text-align:right}
.bar{height:6px;background:var(--card2);border-radius:9px;overflow:hidden;margin:4px 0 0}
.bar i{display:block;height:100%;background:linear-gradient(90deg,var(--acc),var(--acc2))}
main{padding:6px 16px}
.card{background:var(--card);border-radius:16px;padding:14px;margin:10px 0}
.card h2{margin:0 0 4px;font-size:19px}
.tag{display:inline-block;font-size:11px;padding:2px 8px;border-radius:99px;background:var(--card2);color:var(--mut);margin:2px 4px 2px 0}
.hot{color:var(--acc2)}
button{font:inherit;color:var(--ink);background:var(--card2);border:0;border-radius:12px;padding:11px 13px;cursor:pointer}
button.pri{background:linear-gradient(90deg,var(--acc),#c2185b);font-weight:600}
button.pri[disabled]{opacity:.35}
button.sm{padding:6px 10px;font-size:13px}
button.on{background:var(--acc)}
.row{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}
.row>*{flex:1}
nav{position:fixed;bottom:0;left:0;right:0;display:flex;background:#0e0509;border-top:1px solid #2a1520;padding-bottom:env(safe-area-inset-bottom)}
nav button{flex:1;border-radius:0;background:none;color:var(--mut);padding:14px 4px;font-size:13px}
nav button.on{color:var(--acc);background:none}
select,input[type=text],input[type=password]{font:inherit;background:var(--card2);color:var(--ink);border:0;border-radius:10px;padding:10px;width:100%}
.lock{opacity:.4}
.chk{display:flex;gap:10px;align-items:flex-start;margin:8px 0;padding:10px;background:var(--card2);border-radius:12px;font-size:14px}
.chk input{width:20px;height:20px;flex:none}
.mut{color:var(--mut);font-size:13px}
.big{font-size:26px;font-weight:700}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.stat{background:var(--card2);border-radius:12px;padding:12px;text-align:center}
.ach{display:flex;gap:10px;align-items:center;padding:7px 0;border-bottom:1px solid #2a1520}
.ach.off{opacity:.35}
.pill{display:flex;gap:6px;overflow-x:auto;padding:4px 0}
.pill button{white-space:nowrap}
.q{display:flex;align-items:center;gap:8px;padding:7px 0;border-bottom:1px solid #2a1520}
.q .n{flex:1}
.q button{padding:5px 10px;font-size:13px}
#cover{display:none;position:fixed;inset:0;background:#fff;color:#111;z-index:9;padding:24px;font:16px sans-serif}
.banner{border-left:3px solid var(--acc)}
#toast{display:none;position:fixed;top:10px;left:12px;right:12px;background:#000;border:1px solid var(--acc);border-radius:12px;padding:10px 14px;z-index:8;font-size:14px}
@media (prefers-reduced-motion:no-preference){.banner{animation:fd .25s}@keyframes fd{from{opacity:0}to{opacity:1}}}
.match{float:right;font-size:20px;font-weight:700;color:var(--acc2)}
</style></head><body>

function score(it,c){
 if(gate(it,c.partner)||it.m>c.time)return null;
 if(c.where==="bed"&&!it.pl.includes("b"))return null;
 if(c.where==="quiet"&&!it.pl.includes("q"))return null;
 let s=50,why=[];
 s-=Math.abs(it.e-c.energy)*10;if(it.e<=c.energy)why.push("fits your energy");

 if(!hist.length){s+=20;why.push("new"+(c.partner?" for "+c.partner:""))}
 else if((Date.now()-hist[hist.length-1].t)/864e5<7)s-=15;
 const cl=S.log.filter(l=>(!c.partner||l.partner===c.partner)&&byId(l.id).c===it.c);
 if(cl.length>=2){const avg=cl.reduce((a,l)=>a+l.rate,0)/cl.length;s+=(avg-2)*12;if(avg>=2.4)why.push("rated high before")}
 const wk=S.log.filter(l=>Date.now()-l.t<7*864e5);
 if(S.log.length&&!wk.some(l=>byId(l.id).c===it.c)){s+=8;why.push("variety bonus")}
 if(it.k&&c.partner&&part(c.partner).k[it.id]==="y"){s+=10;why.push("they said yes")}
 return {s:Math.max(5,Math.min(99,Math.round(s))),why};
}

}

let rnd=Math.random,finishFn=null;
function pick(ev,cond){
 const pool=REG.filter(m=>m.ev===ev&&(!cond||cond(m)));
 const ok=pool.filter(m=>(PR.n-(PR.last[m.id]===undefined?-1e9:PR.last[m.id]))>=(CD[m.rar]||0));
 let c=ok.filter(m=>!PR.recent.includes(m.id));
 if(!c.length)c=ok.filter(m=>PR.recent[PR.recent.length-1]!==m.id);
 if(!c.length)c=ok;
 if(!c.length)return null;
 const w=c.map(m=>(WT[m.rar]||1)*(PS.seen.has(m.id)?1:3));
 let r=rnd()*w.reduce((a,b)=>a+b,0),i=0;
 while(i<c.length-1&&(r-=w[i])>0)i++;
 const m=c[i];PR.n++;PR.last[m.id]=PR.n;PR.recent.push(m.id);if(PR.recent.length>24)PR.recent.shift();PS.seen.add(m.id);persist();return m;
}
function say(m){if(!PR.jokes||!m)return;PS.banner={t:m.text}}

function toast(t){TQ.push(t);if(!tbusy)nextToast()}
function nextToast(){const e=document.getElementById("toast"),t=TQ.shift();if(!t){tbusy=false;if(e)e.style.display="none";return}tbusy=true;if(e){e.textContent=t;e.style.display="block"}setTimeout(nextToast,3800)}
function unlock(n){if(PR.ach.includes(n)||!PA[n])return;PR.ach.push(n);persist();toast("Achievement: "+n+". "+PA[n][1])}

function seq(n){const ch=[];for(let i=0;i<n;i++){const m=pick("loading",x=>!ch.some(c=>c.id===x.id));if(m)ch.push(m)}return ch.map(m=>m.text)}
function sub(it){return it.k?({1:"Low-risk feature. Still needs a quick check-in.",2:"Requires prior configuration (negotiation).",3:"Full protocol required. No shortcuts."})[it.risk]:({1:"A reliable release candidate.",2:"Beta build. Read the notes.",3:"Experimental build. Read the documentation."})[it.e]}
function build(){
 if(PS.loading&&finishFn){finishFn();return}
 const kind=res?"regen":"first";
 if(kind==="regen"){PS.regens++;evt("regen")}else evt("generate");
 PS.banner=null;PS.err=null;
 const fin=()=>{clearTimeout(PS.lt);PS.loading=false;finishFn=null;try{plan();afterBuild(kind)}catch(e){PS.errored=true;const m=pick("error");PS.err=m?m.text:"That didn't work. Your preferences are still here.";render()}};
 if(!PR.drama){fin();return}
 const ms=seq(3);PS.loading=true;finishFn=fin;let i=0;
 const step=()=>{PS.loadMsg=ms[i]||"Working…";render();i++;PS.lt=setTimeout(i<ms.length?step:fin,700)};
 step();
}
function afterBuild(kind){
 if(PS.errored){unlock("QA Department");PS.errored=false}
 res.forEach(o=>{PS.seenItems.add(o.it.id);if(!PR.seen.includes(o.it.id))PR.seen.push(o.it.id)});
 if(res.length)unlock("First Contact");
 if(PS.regens>=TH.regen)unlock("Version Control");
 if(PR.seen.length>=TH.explore)unlock("The Explorer");
 const av=IT.filter(x=>!libReason(x)),all=av.length&&av.every(x=>PR.seen.includes(x.id));
 if(all)unlock("Completionist");
 const off=typeof navigator!=="undefined"&&navigator.onLine===false;
 if(off){PS.offlineUsed=true;unlock("Offline Operator")}
 let m=null;
 if(!res.length)m=pick("no_results");
 else if(!PR.flags.firstResult){PR.flags.firstResult=1;m=pick("first_result")}
 else if(off)m=pick("offline");
 else if(all&&!PS.allSaid){PS.allSaid=1;m=pick("all_seen")}
 else if(PS.regens>=TH.regenEgg)m=pick("regen_many");
 else if(kind==="regen"&&PS.regens>=3)m=pick("regen_few");
 PS.banner=null;say(m);
 const pl=pick("regen_btn",x=>!x.playful||(ctx.mood!=="tender"&&ctx.energy>=2));PS.regLabel=pl?pl.text:"Run it back";
 const pb=pick("primary");PS.btn=pb?pb.text:"Run it back";
 persist();render();
}

function cmdRun(raw){
 const k=String(raw).toLowerCase().trim().replace(/\s+/g," ");
 if(Object.prototype.hasOwnProperty.call(CMD,k)){
  if(!PR.flags.secret){PR.flags.secret=1;persist();unlock("Secret Service");const l=pick("secret_first");if(l&&PR.jokes)toast(l.text)}
  evt("secret");return CMD[k]}
 return "Unrecognized command. Nothing was executed. Nothing ever is.";
}

  <div class="card"><b>Skill paths</b>${PATHS.map(p=>{const x=pathXP(p),l=Math.floor(x/60)+1;return `<div class="q"><div style="width:90px">${p}</div><div class="bar" style="flex:1"><i style="width:${x%60/60*100}%"></i></div><div class="mut">Lv ${l}</div></div>`}).join("")}</div>
  <div class="card"><b>Gear</b><div class="mut">Tick what you own. Scenes needing missing gear are never suggested.</div>${Object.keys(GEAR).map(k=>`<label class="chk"><input type="checkbox" ${S.props[k]?"checked":""} onchange="S.props['${k}']=this.checked;save()"><span>${GEAR[k]}</span></label>`).join("")}</div>
  <div class="card"><b>Modifiers unlocked</b><div class="mut">Level-ups and loot drops open more. They work with any partner.</div>${modsAvail().map(i=>`<div class="q"><div class="n"><b>${MODS[i][0]}</b><div class="mut">${MODS[i][1]}</div></div></div>`).join("")}</div>
  <div class="card"><b>Achievements</b>${ACH.map(a=>`<div class="ach ${S.ach.includes(a[0])?"":"off"}"><span>${S.ach.includes(a[0])?"🏆":"🔒"}</span><div><b>${a[0]}</b><div class="mut">${a[1]}</div></div></div>`).join("")}</div>
  <div class="card"><b>Standing</b><div class="mut">Your numbers vs the only sourced benchmarks available (India 3, world 9, highest country 14.5 lifetime partners). Self-reported surveys, rough context only. Stored on this device.</div>
  <div class="row"><input type="number" min="0" aria-label="Lifetime partners" placeholder="Lifetime partners" value="${S.me.n}" onchange="setMe('n',this.value)"><input type="number" min="0" aria-label="Age at first time" placeholder="Age at first" value="${S.me.a}" onchange="setMe('a',this.value)"></div>${standing()}</div>
  <div class="card"><b>Personality</b>
  <label class="chk"><input type="checkbox" ${PR.jokes?"checked":""} onchange="PR.jokes=this.checked;if(!this.checked)PS.banner=null;persist();render()"><span>Jokes and Easter eggs</span></label>
  <label class="chk"><input type="checkbox" ${PR.drama?"checked":""} onchange="PR.drama=this.checked;persist()"><span>Dramatic loading (about 2 extra seconds, tap Skip to bypass). Flavor text only, no real computation.</span></label>
  <div class="row"><button onclick="resetPers()">Reset Easter eggs</button></div></div>
  <div class="card"><b>Back office</b><div class="mut">A harmless command line. Nothing runs and nothing leaves the device. Try: help</div>
  <div class="row"><input id="cmd" type="text" aria-label="Back office command" placeholder="command" autocomplete="off" autocapitalize="off" spellcheck="false" onkeydown="if(event.key==='Enter')runCmd()"><button class="sm" style="flex:0" onclick="runCmd()">Run</button></div>
  <div role="status" aria-live="polite" class="mut" style="margin-top:8px">${PS.cmdOut||""}</div></div>
  <div class="card"><b>Software achievements</b>${Object.keys(PA).map(k=>`<div class="ach ${PR.ach.includes(k)?"":"off"}"><span>${PR.ach.includes(k)?"🏆":"🔒"}</span><div><b>${k}</b><div class="mut">${PA[k][0]}</div></div></div>`).join("")}</div>
  <div class="card"><b>Privacy</b><div class="row"><input id="pn" type="password" inputmode="numeric" placeholder="Set PIN"><button class="sm" style="flex:0" onclick="setPin()">Save</button></div>
  <div class="mut" style="margin-top:6px">Tap the title to disguise the screen as Notes. Double tap to return.</div>
  <div class="row"><button onclick="exp()">Export backup</button><button onclick="if(confirm('Wipe everything?')){localStorage.removeItem('sutra2');location.reload()}">Reset</button></div></div>`;
 }
}
render();onOpen();
</script></body></html>
